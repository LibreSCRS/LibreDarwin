# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# LibreDarwin distributes no prebuilt binaries of its own: it is the macOS
# broker host, built from source by whoever packages it, and the signed and
# notarized macOS artifact belongs to the SwiftUI host rather than here. A
# release here is the signed tag and curated notes from CHANGELOG.md, and
# nothing else: ci/release-assets.txt declares no asset, so there is nothing to
# seal and no seal job.
#
# The workflow deliberately performs NO build, which keeps tagging independent
# of what the agent happens to have published at that moment. What it does
# assert about the agent is the lock: on a tag, the preflight holds every row of
# deps.lock to the upstream tag of the same version.
#
# Both jobs are LibreSCRS/ci actions, the same code every component releases
# through:
#   preflight  the run's mode against its ref; on a tag, the tag's signature by
#              the release key (on a branch, the verifier proved both ways on
#              fixture tags); VERSION, CHANGELOG and every version surface in
#              agreement; deps.lock well formed and reachable (on a tag: equal
#              to the upstream tags of this version).
#   publish    the notes from the CHANGELOG section, the staged asset set held
#              to the (empty) declaration, and on a tag `gh release create` and
#              the published release read back. A rehearsal creates nothing.

on:
  push:
    tags:
      # Same shape as the sibling components. Every tag this project has ever
      # published is unprefixed, and the archive URL agrees.
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Rehearsal: any branch, the whole chain except creating the release.
  # `publish` is refused on a ref that is not a tag.
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

# One run per ref at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release and fail at the last step.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@bd36eee50ba085ef4f052ea2767cff910e2e62e7
        with:
          mode: ${{ inputs.mode || 'publish' }}
          # The floor arm must find at least one first-party floor (the
          # LibreMiddleware and LibreAgent find_package calls); none is a scan
          # that read nothing, not a clean result.
          version-min: '1'

  publish:
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: LibreSCRS/ci/actions/release-publish@bd36eee50ba085ef4f052ea2767cff910e2e62e7
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          # Notes only: ci/release-assets.txt declares no asset.
          artifacts: ''
