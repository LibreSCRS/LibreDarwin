# SPDX-License-Identifier: LGPL-2.1-or-later
#
# LibreDarwin is the macOS broker-host: the librescrs-agent daemon (App-Group
# socket + CBOR wire) built on LibreAgent::Core + LibreAgent::Wire, plus the
# agent-owned prompter and the skeleton PKCS#11 facade. It links LibreMiddleware
# only through LibreAgent::Core, so the real build runs on a macOS runner that
# first builds+installs LibreMiddleware, then builds LibreDarwin against the
# sibling LibreAgent source (both components). The wire codec/framing/message-
# model tests (incl. the CDDL contract guard and the CBOR fuzz gate) live in
# LibreAgent's own CI now, not here. The hardware sign-smoke (SignHwSmokeTest)
# GTEST_SKIP()s without LIBRESCRS_TEST_PIN, so an unattended CI run is green,
# not failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs. Without this the only ways to exercise the macOS job are a push
  # to main or an open pull request, so a change that cannot be built anywhere
  # else has no way to be checked before it lands.
  workflow_dispatch:

jobs:
  format-check:
    # The format gate needs neither Xcode nor LibreMiddleware, so it runs on
    # ubuntu with the clang-format-21 the rest of the org pins. Covers the C++
    # and Objective-C++ backend sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        run: |
          find agent prompter pkcs11-module \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.mm' \) -print0 \
            | xargs -0 clang-format-21 --dry-run --Werror

  build-macos:
    # macOS 15 runner: the deployment target + SDK (Xcode 16) needed by the
    # LibreMiddleware SHARED build and the -fexperimental-library C++23 the
    # backend uses on AppleClang.
    runs-on: macos-15
    env:
      # Where LibreMiddleware installs and where LibreDarwin (+ the FetchContent
      # LibreAgent) find it via find_package(LibreMiddleware 4.2 CONFIG).
      LM_PREFIX: ${{ github.workspace }}/lm-prefix
      # Git ref of LibreMiddleware to build against — track its trunk during the
      # development cycle (as LibreAgent/LibreCelik/LibreMac do). The 4.2 pin in
      # CMakeLists.txt enforces the required version independently of this ref.
      MIDDLEWARE_REF: main
      # LibreAgent ref: READ FROM THE PIN, not a branch name.
      #
      # This was `main`, and the pin in cmake/FindOrUseLibreAgent.cmake was
      # therefore decorative: CI never once built the combination this repo
      # declares. The producer landed a reshaped trust type on its trunk and
      # this repo went red on a commit that had not changed -- a break with no
      # bump to point at, in a repo whose whole convention is that the bump
      # rides in the commit that needs it.
      #
      # Read at run time from the cmake file rather than copied here: two
      # places holding one hash is the defect this is fixing, one level up.
    steps:
      - name: Install build tools
        # ninja drives the CMake builds; autoconf/automake/libtool/pkg-config are
        # required by the vendored OpenSC autoconf bootstrap LibreMiddleware
        # builds (same as the LibreCelik/LibreMac macOS jobs). jsonschema: LM's
        # opensc-plugin manifest2header.py hard-fails without it (same install
        # line as LM's own release.yml macOS job).
        run: |
          brew install ninja autoconf automake libtool pkg-config
          python3 -m pip install --break-system-packages --user jsonschema

      - uses: actions/checkout@v4
        with:
          path: LibreDarwin

      - name: Resolve the pinned LibreAgent revision
        id: agent_pin
        # Fails loudly on a pin that is not 40 hex: a blank ref would silently
        # check out the default branch, which is exactly the behaviour being
        # removed here.
        run: |
          pin=$(sed -n 's/.*GIT_TAG \([0-9a-f]\{40\}\).*/\1/p' \
                LibreDarwin/cmake/FindOrUseLibreAgent.cmake | head -1)
          if [ -z "$pin" ]; then
            echo "no 40-hex GIT_TAG found in cmake/FindOrUseLibreAgent.cmake" >&2
            exit 1
          fi
          echo "ref=$pin" >> "$GITHUB_OUTPUT"
          echo "LibreAgent pinned at $pin"

      - name: Checkout LibreAgent (sibling FetchContent source)
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreAgent
          ref: ${{ steps.agent_pin.outputs.ref }}
          path: LibreAgent

      - name: Checkout LibreMiddleware
        # submodules: recursive — LM vendors OpenSC + curl as git submodules,
        # both needed for the SHARED build to configure.
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ env.MIDDLEWARE_REF }}
          path: LibreMiddleware
          fetch-depth: 0
          submodules: recursive

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: LibreMiddleware
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      - name: Configure LibreDarwin
        working-directory: LibreDarwin
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DFETCHCONTENT_SOURCE_DIR_LIBREAGENT="$GITHUB_WORKSPACE/LibreAgent"

      - name: Check -fexperimental-library is uniform
        # Runs BEFORE the build, because the point is to catch a translation unit
        # compiled against a different libc++ than the one it will link with --
        # a mismatch that produces a green build and a wrong program, so waiting
        # for a failure is waiting for something that does not come.
        #
        # It reads what the compiler was actually told, not what the CMake files
        # look like they say. Proved by ci/scripts/check-experimental-library.selftest.sh.
        working-directory: LibreDarwin
        run: python3 ci/scripts/check-experimental-library.py build

      - name: Prove the flag gate still fails when it should
        # A gate nobody has seen fail is a line in a workflow file. Seven cases,
        # instant, no build required.
        working-directory: LibreDarwin
        run: ./ci/scripts/check-experimental-library.selftest.sh

      - name: Build
        working-directory: LibreDarwin
        run: cmake --build build -j4

      - name: Test
        # The hardware SignHwSmokeTest auto-skips without LIBRESCRS_TEST_PIN, so
        # this is green unattended. All wire/transport/frontend/lifecycle unit
        # tests run against fakes + a real bound socket (no PC/SC reader needed).
        working-directory: LibreDarwin
        run: ctest --test-dir build --output-on-failure --no-tests=error
