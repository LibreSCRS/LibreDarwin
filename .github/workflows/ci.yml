# SPDX-License-Identifier: LGPL-2.1-or-later
#
# LibreDarwin is the macOS broker-host: the librescrs-agent daemon (App-Group
# socket + CBOR wire) built on LibreAgent::Core + LibreAgent::Wire, plus the
# agent-owned prompter and the skeleton PKCS#11 facade. It links LibreMiddleware
# only through LibreAgent::Core, so the real build runs on a macOS runner that
# first builds+installs LibreMiddleware, then builds LibreDarwin against the
# sibling LibreAgent source (both components). The wire codec/framing/message-
# model tests (incl. the CDDL contract guard and the CBOR fuzz gate) live in
# LibreAgent's own CI now, not here. The hardware sign-smoke (SignHwSmokeTest)
# GTEST_SKIP()s without LIBRESCRS_TEST_PIN, so an unattended CI run is green,
# not failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs. Without this the only ways to exercise the macOS job are a push
  # to main or an open pull request, so a change that cannot be built anywhere
  # else has no way to be checked before it lands.
  workflow_dispatch:

jobs:
  format-check:
    # The format gate needs neither Xcode nor LibreMiddleware, so it runs on
    # ubuntu with the clang-format-21 the rest of the org pins. Covers the C++
    # and Objective-C++ backend sources.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the scope check below
        # reads too: a directory nobody formats cannot appear without one of
        # these two steps saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # A wedged job in this project once held a runner until it was cancelled by hand.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      - name: Check every tracked source is reachable by the formatter
        run: ./ci/scripts/check-format-scope.sh

      - name: Check every skip carries a reason
        # A test that skips without saying why is indistinguishable from a test
        # that passed. Costs a second and builds nothing.
        run: ./ci/scripts/check-skip-reasons.sh

      - name: Changelog and version agree on the pending release
        # Run on every push with the version this tree is heading for, so the
        # agreement is proved weeks before the tag rather than first on a tag
        # that cannot be taken back. The release job calls the same script with
        # the tag's version.
        run: ci/scripts/check-release-lockstep.sh "$(head -n1 VERSION | tr -d '[:space:]')"

      - name: Prove the version-surface check still fails when it should
        # Both sides of the lockstep check above read VERSION, so it cannot
        # notice a build that ships a different number -- and for a while the
        # embedded bundle information said 0.1 while every label said 5.0.0.
        # This selftest is what keeps the check below from being a check that
        # cannot fail.
        run: ./ci/scripts/check-version-surfaces.selftest.sh

      - name: Every surface states the version in VERSION
        run: ./ci/scripts/check-version-surfaces.sh

      - name: Every job carries a time bound
        # An unbounded job that hangs holds a runner for six hours and will
        # not serve its log until the run is cancelled, so the failing test
        # cannot even be named. This fails when a new job arrives without a
        # bound, which is the only moment the omission is cheap to fix.
        run: ci/scripts/check-job-timeouts.sh

      - name: The agent pin is read from the pin file, not mined out of CMake
        # The revision moved into cmake/libreagent.pin; the workflow that used
        # to mine it out of cmake/FindOrUseLibreAgent.cmake with a regex then
        # resolved to the empty string and died naming a file that was correct.
        # Nothing here could see that: the two scripts that read a workflow
        # look at timeout-minutes (check-job-timeouts.sh) and at which gate
        # scripts are named (check-gates-wired.sh), not at where the agent ref
        # comes from.
        run: ci/scripts/check-agent-pin-wiring.sh

      - name: Prove the pin-wiring gate still fails when it should
        run: ./ci/scripts/check-agent-pin-wiring.selftest.sh

      - name: The pin's form check can accept a real pin
        # The wiring gate above proves the workflow reads cmake/libreagent.pin.
        # It says nothing about the guard in cmake/FindOrUseLibreAgent.cmake
        # that decides whether a pin is well formed -- and the obvious spelling
        # of that guard uses a {n} repetition CMake's regex engine does not
        # have, so it refuses every hash, including a correct one. Nothing
        # would speak, because the guard only runs when someone configures the
        # project. This step runs it, in both directions.
        run: ci/scripts/check-pin-form.sh

      - name: Prove the pin-form gate still fails when it should
        run: ./ci/scripts/check-pin-form.selftest.sh

      - name: Every shipped gate is wired into CI
        # A gate nobody runs is not a gate. Every script this repository ships
        # under ci/scripts/ has to be reachable by name from something CI runs,
        # or be listed with a reason in ci/gate-wiring-exceptions.txt -- and a
        # listed path that is no longer tracked fails too, so the amnesty
        # cannot go stale.
        run: ci/scripts/check-gates-wired.sh

      - name: Gate-wiring check self-test
        run: ci/scripts/check-gates-wired.selftest.sh

      - name: Every first-party version floor names the major in VERSION
        # Searching a tree for one literal version token misses the floor that
        # matters: a `4.0` floor survives a sweep that looked for `4.2`, and
        # nothing says it was never read. This measures the property: every
        # first-party find_package/find_dependency floor must name the major
        # the VERSION file names. It reads VERSION and never `git describe`, so
        # it is decidable before a tag exists -- which is the whole window in
        # which the mistake is cheap. --min 1 is the vacuum guard: a scan that
        # matches nothing is unmeasured, not clean.
        run: ci/scripts/check-version-floors.sh --min 1

      - name: Prove the floor gate still fails when it should
        # Every case runs the gate against a fixture tree built here, so this
        # needs no build, no compiler and no network. A gate nobody has seen
        # fail is a line in a workflow file.
        run: ./ci/scripts/check-version-floors.selftest.sh

      - name: The version this tree stamps names the major in VERSION
        # The floor gate reads VERSION and the sources, so it stays green
        # whatever the version derivation does, and a check that configures
        # with git switched off is measuring the one input under which a tag
        # cannot win. Between code freeze and the tag `git describe` still
        # answers with the PREVIOUS release, and a tree that lets it decide
        # installs a package whose major contradicts its own VERSION, changelog
        # and packaging. This configures the real CMakeLists against a stubbed
        # tag, in both directions, and creates no tag anywhere.
        run: ci/scripts/check-version-stamp.sh --verbose

      - name: Prove the stamp gate still fails when it should
        # Seven fixtures, no compiler, no build. Two of them are shapes that
        # have really been written: the tag deciding unconditionally, and git
        # being ignored altogether.
        run: ./ci/scripts/check-version-stamp.selftest.sh

  agent-interface:
    # The macOS job builds against cmake/libreagent.pin -- the agent interface as
    # it WAS. That is not the combination a release ships, and it stayed green
    # while SecCodeAuthorizer::authorize still returned bool and the base class
    # had already moved to AuthorizationOutcome. So this job runs the same check
    # against BOTH revisions, and they answer different questions:
    #
    #   the agent's main branch -- what a release is cut from. Green here means
    #   this repository has followed the interface. The unpinned checkout is
    #   named in ci/agent-ref-exceptions.txt: an agent ref the pin does not name
    #   is otherwise exactly what check-agent-pin-wiring.sh exists to report, and
    #   this one step has to be visible rather than exempt by accident.
    #
    # The other direction -- the check against cmake/libreagent.pin, which is
    # what build-macos actually compiles -- is the job below. It is deliberately
    # a JOB and not a step here: the two answer different questions and one of
    # them is expected to be red until the pin moves, and a step folded into
    # this job would take this job's verdict down with it and hide whether the
    # repository has followed the trunk at all.
    #
    # Ubuntu: the check needs a C++ compiler and nothing Apple, so it also
    # answers while the macOS job is unavailable.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: LibreDarwin

      - uses: actions/checkout@v4
        id: agent_trunk
        with:
          repository: LibreSCRS/LibreAgent
          ref: main
          path: LibreAgent

      - name: Install gtest headers
        # Headers only -- the check compiles with -fsyntax-only and links
        # nothing. The authorizer's own test is one of the translation units the
        # check compiles, and without these it refuses to judge rather than
        # quietly measuring one header.
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev

      - name: Prove the interface gate still fails when it should
        # Synthetic pairs, so the suite does not pass or fail with the defect it
        # guards. A gate whose compile step quietly stopped compiling would
        # otherwise report a green.
        run: LibreDarwin/ci/scripts/check-agent-interface.selftest.sh

      - name: Darwin authorizer implements the agent interface
        # `trunk` names where those headers came from, and it changes one
        # sentence: if the agent turns out to predate the outcome type, this
        # job is told to publish that revision rather than to raise a pin it
        # never reads.
        run: |
          cd LibreDarwin
          ci/scripts/check-agent-interface.sh "$GITHUB_WORKSPACE/LibreAgent/include" trunk

  agent-interface-pin:
    # The same check against cmake/libreagent.pin -- the revision this
    # repository DECLARES, and the one build-macos compiles. The job above
    # answers "has this repository followed the agent trunk"; this one answers
    # "does what it declares still build", and the two can disagree.
    #
    # It is red on purpose right now, and this is what turns it green: the pin
    # names a LibreAgent revision from before the authorizer's return type
    # became a three-way outcome, so the header this repository ships does not
    # compile against it. A pin may only name a revision that exists on the
    # remote, so the order is fixed -- the agent is published first, then this
    # pin is moved to a published revision that carries the outcome type, and
    # only then is anything tagged here. Raising the pin by hand to a revision
    # nobody can fetch would turn this green and every checkout that uses it
    # red.
    #
    # Until that first step happens the job ABOVE is red as well, for the same
    # missing type: the outcome type is not on the agent's published branch
    # either, so `ref: main` fetches headers that predate it. The benefit of
    # splitting the two -- a trunk verdict that survives a stale pin -- is
    # therefore pending, not yet demonstrated; what the split does buy today is
    # that the two reds name different next steps, publish and re-pin, instead
    # of one job naming a pin for both.
    #
    # Failing here rather than inside the macOS build is the whole point: the
    # same headers fail the same way in build-macos, an hour in, naming no
    # cause.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: LibreDarwin

      - name: Resolve the pinned LibreAgent revision
        id: agent_pin_interface
        # Same read and same validation as build-macos: the revision lives in
        # the pin file, and a pin that is not 40 hex fails here rather than
        # being passed to actions/checkout, which would silently take the
        # default branch and measure the trunk instead.
        run: |
          pin=$(tr -d '[:space:]' < LibreDarwin/cmake/libreagent.pin)
          case "$pin" in
            *[!0-9a-f]* | "") echo "::error::cmake/libreagent.pin is not 40 hex: '$pin'"; exit 1 ;;
          esac
          [ ${#pin} -eq 40 ] || { echo "::error::cmake/libreagent.pin is ${#pin} chars, want 40"; exit 1; }
          echo "ref=$pin" >> "$GITHUB_OUTPUT"
          echo "LibreAgent pinned revision: $pin"

      - name: Checkout LibreAgent at the pin
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreAgent
          ref: ${{ steps.agent_pin_interface.outputs.ref }}
          path: LibreAgentPinned

      - name: Install gtest headers
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev

      - name: Darwin authorizer compiles against the revision this repository declares
        # The gate's own message names which side is stale. This adds the one
        # thing it cannot know: what has to happen, and in what order, for the
        # pinned side to stop being stale.
        #
        # Only on rc=1. The gate exits 2 to say it is REFUSING TO JUDGE -- no
        # compiler, no headers, a named translation unit gone -- and blaming the
        # pin for that would name a cause it just declined to name, which is how
        # a gate ends up distrusted and then deleted. Both exits stay red.
        run: |
          cd LibreDarwin
          rc=0
          ci/scripts/check-agent-interface.sh "$GITHUB_WORKSPACE/LibreAgentPinned/include" pin || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error file=cmake/libreagent.pin::this repository does not build against the LibreAgent revision it declares. Publish the agent revision that carries the three-way authorization outcome, move this pin to it, and re-run; the pin may name only a revision that exists on the remote, so moving it first would break every checkout that reads it."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::the interface check refused to judge the pinned revision (rc=$rc); its own output above names why. This says nothing about the pin."
          fi
          exit "$rc"

  build-macos:
    # macOS 15 runner: the deployment target + SDK (Xcode 16) needed by the
    # LibreMiddleware SHARED build and the -fexperimental-library C++23 the
    # backend uses on AppleClang.
    timeout-minutes: 60
    runs-on: macos-15
    env:
      # Where LibreMiddleware installs and where LibreDarwin (+ the FetchContent
      # LibreAgent) find it via find_package(LibreMiddleware 5.0 CONFIG).
      LM_PREFIX: ${{ github.workspace }}/lm-prefix
      # Git ref of LibreMiddleware to build against — track its trunk during the
      # development cycle (as LibreAgent/LibreCelik/LibreMac do). The 5.0 pin in
      # CMakeLists.txt enforces the required version independently of this ref.
      MIDDLEWARE_REF: main
      # LibreAgent ref: READ FROM THE PIN, not a branch name.
      #
      # This was `main`, and the pin in cmake/FindOrUseLibreAgent.cmake was
      # therefore decorative: CI never once built the combination this repo
      # declares. The producer landed a reshaped trust type on its trunk and
      # this repo went red on a commit that had not changed -- a break with no
      # bump to point at, in a repo whose whole convention is that the bump
      # rides in the commit that needs it.
      #
      # Read at run time from cmake/libreagent.pin rather than copied here:
      # two places holding one hash is the defect this is fixing, one level up.
    steps:
      - name: Install build tools
        # ninja drives the CMake builds; autoconf/automake/libtool/pkg-config are
        # required by the vendored OpenSC autoconf bootstrap LibreMiddleware
        # builds (same as the LibreCelik/LibreMac macOS jobs). jsonschema: LM's
        # opensc-plugin manifest2header.py hard-fails without it (same install
        # line as LM's own release.yml macOS job).
        run: |
          brew install ninja autoconf automake libtool pkg-config
          python3 -m pip install --break-system-packages --user jsonschema

      - uses: actions/checkout@v4
        with:
          path: LibreDarwin

      - name: Resolve the pinned LibreAgent revision
        id: agent_pin
        # Read from the pin file rather than mined out of the CMake call: the
        # revision lives in cmake/libreagent.pin, so a regex hunting for a SHA
        # in the CMake that declares the fetch resolves to the empty string --
        # the call names a variable, not a hash.
        #
        # A pin that is not 40 hex FAILS here rather than being passed on. An
        # empty ref makes actions/checkout silently take the default branch --
        # which is exactly the behaviour this step removes, so falling back to
        # it on a malformed pin would reintroduce the bug at the moment the
        # guard was most needed.
        run: |
          pin=$(tr -d '[:space:]' < LibreDarwin/cmake/libreagent.pin)
          case "$pin" in
            *[!0-9a-f]* | "") echo "::error::cmake/libreagent.pin is not 40 hex: '$pin'"; exit 1 ;;
          esac
          [ ${#pin} -eq 40 ] || { echo "::error::cmake/libreagent.pin is ${#pin} chars, want 40"; exit 1; }
          echo "ref=$pin" >> "$GITHUB_OUTPUT"
          echo "LibreAgent pinned revision: $pin"

      - name: Checkout LibreAgent (sibling FetchContent source)
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreAgent
          ref: ${{ steps.agent_pin.outputs.ref }}
          path: LibreAgent

      - name: Checkout LibreMiddleware
        # submodules: recursive — LM vendors OpenSC + curl as git submodules,
        # both needed for the SHARED build to configure.
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreMiddleware
          ref: ${{ env.MIDDLEWARE_REF }}
          path: LibreMiddleware
          fetch-depth: 0
          submodules: recursive

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: LibreMiddleware
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      - name: Configure LibreDarwin
        working-directory: LibreDarwin
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DFETCHCONTENT_SOURCE_DIR_LIBREAGENT="$GITHUB_WORKSPACE/LibreAgent"

      - name: Check -fexperimental-library is uniform
        # Runs BEFORE the build, because the point is to catch a translation unit
        # compiled against a different libc++ than the one it will link with --
        # a mismatch that produces a green build and a wrong program, so waiting
        # for a failure is waiting for something that does not come.
        #
        # It reads what the compiler was actually told, not what the CMake files
        # look like they say. Proved by ci/scripts/check-experimental-library.selftest.sh.
        working-directory: LibreDarwin
        run: python3 ci/scripts/check-experimental-library.py build

      - name: Prove the flag gate still fails when it should
        # A gate nobody has seen fail is a line in a workflow file. Seven cases,
        # instant, no build required.
        working-directory: LibreDarwin
        run: ./ci/scripts/check-experimental-library.selftest.sh

      - name: Build
        working-directory: LibreDarwin
        run: cmake --build build -j4

      - name: Test
        # The hardware SignHwSmokeTest auto-skips without LIBRESCRS_TEST_PIN, so
        # this is green unattended. All wire/transport/frontend/lifecycle unit
        # tests run against fakes + a real bound socket (no PC/SC reader needed).
        working-directory: LibreDarwin
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Check the discovered test set
        # ctest reports whatever the build directory discovered, so a suite that
        # quietly stops being registered reads as success. Every other repository
        # in the project has carried this listing for a while; this one did not,
        # which is how its roster went unwatched.
        working-directory: LibreDarwin
        run: ./ci/scripts/test-manifest-gate.sh --check build macos

      - name: Prove the manifest gate
        working-directory: LibreDarwin
        run: bash ci/scripts/test-manifest-gate.selftest.sh
