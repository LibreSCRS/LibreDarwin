# SPDX-License-Identifier: LGPL-2.1-or-later
#
# LibreDarwin is the macOS broker-host: the librescrs-agent daemon (App-Group
# socket + CBOR wire) built on LibreAgent::Core + LibreAgent::Wire, plus the
# agent-owned prompter and the skeleton PKCS#11 facade. It links LibreMiddleware
# only through LibreAgent::Core, so the real build runs on a macOS runner that
# first builds+installs LibreMiddleware, then builds LibreDarwin against the
# sibling LibreAgent source (both components). The wire codec/framing/message-
# model tests (incl. the CDDL contract guard and the CBOR fuzz gate) live in
# LibreAgent's own CI now, not here. The hardware sign-smoke (SignHwSmokeTest)
# GTEST_SKIP()s without LIBRESCRS_HW, and ctest reports it as Skipped, not
# Passed: an unattended run is green without claiming the hardware gate ran.
name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  # Manual runs. Without this the only ways to exercise the macOS job are a push
  # to main or an open pull request, so a change that cannot be built anywhere
  # else has no way to be checked before it lands.
  workflow_dispatch:

jobs:
  format-check:
    # The format gate needs neither Xcode nor LibreMiddleware, so it runs on
    # ubuntu with the clang-format-21 the rest of the org pins. Covers the C++
    # and Objective-C++ backend sources.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the self-test runner picks its set with
      # `git ls-files`, and a shallow checkout is a known source of a
      # different set here than locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the scope check below
        # reads too (in the shared gates below): a directory nobody formats
        # cannot appear without one of the two saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # A wedged job in this project once held a runner until it was cancelled by hand.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      - name: This repository's agent and prompter sources read no unrecorded environment variable
        # `launchctl setenv` reaches every job the user's launchd starts, so a
        # variable the agent or the prompter sources honoured was a switch any
        # process running as the user could flip: move a socket, skip the peer
        # check, load another plugin directory into the process that holds the
        # PIN. They are compiled in or passed as arguments now; every read that
        # remains is recorded in ci/env-readers.txt with its reason, and a new
        # one is red until it is. This reads THIS repository's sources only:
        # the LibreMiddleware code linked into the agent process reads variables
        # of its own (LIBRESCRS_PKCS11_MODULE, LIBRESCRS_CERTIFICATES_DIR and
        # others), and a green step says nothing about those. Its self-test runs
        # with the others below.
        run: ./ci/scripts/check-no-env-handles.sh

      - name: The LaunchAgent template parses and carries no empty value
        # plutil accepted a template whose comment was not well-formed XML, so
        # a check on the Mac alone said nothing about it. This one uses a
        # conforming parser and needs no Mac; the build job runs it again on the
        # plist the install writes, which is the one that ships. Its self-test
        # runs with the others below.
        run: python3 ci/scripts/check-launchd-plist.py packaging/launchd/*.plist

      - name: Shared gates
        # The gates this repository shares with the rest of the project, from
        # LibreSCRS/ci at the commit named here; which ones is that
        # repository's profiles/LibreDarwin.txt: the formatter's scope (the
        # roots are ci/format-dirs.txt, read by the step above too), a reason
        # on every skip, the workflows read as data (every gate reached, every
        # job bounded, every step placed where it can run, one LibreSCRS/ci
        # commit throughout), deps.lock (form, reachable from upstream main,
        # the same LibreMiddleware as the locked LibreAgent's), and every
        # self-test this repository ships, each required to report the cases
        # it ran and how many proved its gate red.
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4

  build-macos:
    # macOS 15 runner: the deployment target + SDK (Xcode 16) needed by the
    # LibreMiddleware SHARED build and the -fexperimental-library C++23 the
    # backend uses on AppleClang.
    timeout-minutes: 60
    runs-on: macos-15
    env:
      # Where LibreMiddleware installs and where LibreDarwin (+ the FetchContent
      # LibreAgent) find it via find_package(LibreMiddleware 5.0 CONFIG).
      LM_PREFIX: ${{ github.workspace }}/lm-prefix
    steps:
      - name: Install build tools
        # ninja drives the CMake builds; autoconf/automake/libtool/pkg-config are
        # required by the vendored OpenSC autoconf bootstrap LibreMiddleware
        # builds (same as the LibreCelik/LibreMac macOS jobs). jsonschema: LM's
        # opensc-plugin manifest2header.py hard-fails without it (same install
        # line as LM's own release.yml macOS job). bash: actions/checkout-deps
        # and the shared gates need bash 4 or later, and macOS ships 3.2.
        run: |
          brew install ninja autoconf automake libtool pkg-config bash
          python3 -m pip install --break-system-packages --user jsonschema

      - uses: actions/checkout@v4
        with:
          path: LibreDarwin

      - name: Checkout LibreMiddleware and LibreAgent at the lock
        # Both at the commits deps.lock names, and proved to be those commits
        # before anything builds from them. LibreAgent is the FetchContent
        # source (configure below points at it); the build-phase gates hold the
        # tree CMake really used to the lock again after configure. Full
        # history and submodules because LibreMiddleware derives its version
        # with git describe and vendors OpenSC and curl as submodules.
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          root: LibreDarwin
          names: LibreMiddleware LibreAgent
          path: .
          fetch-depth: '0'
          submodules: recursive

      - name: Build & install LibreMiddleware (Release, SHARED)
        working-directory: ${{ steps.deps.outputs.libremiddleware-path }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build -j4
          cmake --install build

      - name: Configure LibreDarwin
        working-directory: LibreDarwin
        env:
          LIBREAGENT_SRC: ${{ steps.deps.outputs.libreagent-path }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBREDARWIN_WERROR=ON \
            -DFETCHCONTENT_SOURCE_DIR_LIBREAGENT="$LIBREAGENT_SRC"

      - name: Check -fexperimental-library is uniform
        # Runs BEFORE the build, because the point is to catch a translation unit
        # compiled against a different libc++ than the one it will link with --
        # a mismatch that produces a green build and a wrong program, so waiting
        # for a failure is waiting for something that does not come.
        #
        # It reads what the compiler was actually told, not what the CMake files
        # look like they say. Proved by ci/scripts/check-experimental-library.selftest.sh.
        working-directory: LibreDarwin
        run: python3 ci/scripts/check-experimental-library.py build

      - name: Build
        working-directory: LibreDarwin
        run: cmake --build build -j4

      - name: The linked executables embed the version VERSION carries
        # The surface check reads the two plist templates and trusts the build to
        # fill them; this reads what the linker actually embedded, so a link line
        # pointing back at a template turns red here, where it would ship.
        working-directory: LibreDarwin
        run: |
          want="$(head -n1 VERSION | tr -d '[:space:]')"
          want=${want#v}
          for bin in build/agent/librescrs-agent build/prompter/librescrs-prompter; do
            got="$(launchctl plist __TEXT,__info_plist "$bin" | sed -n 's/.*"CFBundleShortVersionString" = "\([^"]*\)";.*/\1/p')"
            [ "$got" = "$want" ] || { echo "::error::$bin embeds CFBundleShortVersionString '$got', VERSION says '$want'"; exit 1; }
            echo "$bin embeds $got"
          done

      - name: Install the tree and check the LaunchAgent it installs
        # The template is checked in the format job; this is the file
        # configure_file() made of it, where a placeholder whose variable is
        # not set has become an empty string without a word. Installed into a
        # directory of its own so nothing on the runner is touched.
        working-directory: LibreDarwin
        run: |
          cmake --install build --prefix "$PWD/install-probe"
          python3 ci/scripts/check-launchd-plist.py install-probe/share/librescrs/launchd/org.librescrs.agent.plist

      - name: The installed prompter carries its process hardening
        # The prompter denies debugger attach and core dumps before it reads a
        # secret. A link that stopped pulling the routine in would still build
        # and pass every test that does not look at the binary; this reads the
        # binary the install step put in place. Proved by
        # ci/scripts/check-defined-symbol.selftest.sh, run in the format job.
        working-directory: LibreDarwin
        run: ./ci/scripts/check-defined-symbol.sh install-probe/libexec/librescrs-prompter 'LibreSCRS::Darwin::hardenSecretProcess()'

      - name: Test
        # SignHwSmokeTest skips without LIBRESCRS_HW, and ctest reports it as
        # Skipped -- its skip pattern matches only when the output ENDS on the
        # skipped list, so a failing case in the same binary still fails. All
        # wire/transport/frontend/lifecycle unit tests run against fakes + a
        # real bound socket (no PC/SC reader needed).
        working-directory: LibreDarwin
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Shared gates after the build
        # ctest reports whatever the build directory discovered, so a suite
        # that quietly stops being registered reads as success: the test
        # manifest compares the discovered set with ci/test-manifest.macos.txt.
        # And the LibreAgent tree CMake really used (FETCHCONTENT_SOURCE_DIR
        # in the cache) is still the locked commit -- the property, not what
        # configure printed.
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          root: LibreDarwin
          phase: build
          build-dir: build
          leg: macos
